<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="No profile photo">
  <!--
    Placeholder shown when someone has no profile photo.

    Replaceable: overwrite this one file with the designer's own artwork and
    every avatar on the platform picks it up — nothing else references the
    shape. Keep the 200x200 viewBox and the circular composition.
  -->
  <circle cx="100" cy="100" r="100" fill="#C5FD1F"/>
  <g fill="#000">
    <!-- shoulders -->
    <path d="M100 118c-33 0-58 20-66 48a100 100 0 0 0 132 0c-8-28-33-48-66-48z"/>
    <!-- neck -->
    <path d="M86 100h28v24H86z"/>
    <!-- ears -->
    <ellipse cx="63" cy="88" rx="8" ry="12"/>
    <ellipse cx="137" cy="88" rx="8" ry="12"/>
    <!-- head -->
    <ellipse cx="100" cy="80" rx="38" ry="45"/>
    <!-- hair, tufted rather than a smooth cap -->
    <path d="M64 70c-2-16 8-30 22-35 6-3 9 1 14-1 8-4 14-2 20 2 5-3 9-1 12 3 10 4 16 15 14 27-3-8-8-13-15-16 2 4 2 7 1 10-4-7-10-11-17-13 1 3 1 6 0 8-5-6-12-9-19-9-9 0-17 4-22 11-3 4-6 8-10 13z"/>
  </g>
  <!-- the question mark reads as the circle showing through the face -->
  <path fill="#C5FD1F" d="M100 47c-13 0-22 8-23 20h13c1-5 4-8 10-8 5 0 9 3 9 8 0 4-2 6-7 10-6 5-9 9-9 16v3h13v-2c0-5 2-7 7-11 7-5 10-10 10-17 0-12-10-19-23-19z"/>
  <circle cx="100" cy="107" r="7.5" fill="#C5FD1F"/>
</svg>
